[project]
name = "ai-analtytics-models"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aditya singh", email = "adityaainghmar04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.147.0",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "sqlglot>=30.24.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-analtytics-models = "ai_analtytics_models:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
