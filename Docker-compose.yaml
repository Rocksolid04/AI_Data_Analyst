
services:
  db:
    image: postgres:16
    container_name: ai-analyst-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: data_analyst
      POSTGRES_USER: analyst_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - analyst_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst_user -d data_analyst"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  analyst_postgres_data:
